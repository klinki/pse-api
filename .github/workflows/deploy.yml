name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-test-deploy:
    concurrency: single
    runs-on: ubuntu-latest
    environment: Production
    env:
      IMAGE: registry.gitlab.com/klinki/docker-registry/pse
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for git describe

      - name: Version
        run: |-
          echo "VERSION=$(git describe --tags --dirty --always)" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Test
        run: |-
          docker build \
            --build-arg VERZION=${VERSION} \
            --build-arg SHORT_COMMIT=${SHORT_COMMIT} \
            --target export-test-results \
            --output type=local,dest=TestResults \
            .

      - name: Test Report
        if: always() # Run even if tests fail
        uses: dorny/test-reporter@v3
        with:
          name: Test Results            # Name of the check run which will be created
          path: "**/TestResults/*.xml"    # Path to test results
          reporter: java-junit        # Format of test results

      - name: Build Image
        run: |-
          docker build \
            -t ${IMAGE}:latest \
            -t ${IMAGE}:${VERSION} \
            --build-arg VERZION=${VERSION} \
            --build-arg SHORT_COMMIT=${SHORT_COMMIT} \
            .

      - name: Login to GitLab
        if: ${{ github.ref_name == 'master' }}
        uses: docker/login-action@v4
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image
        if: ${{ github.ref_name == 'master' }}
        run: |-
          docker push ${IMAGE}:${VERSION}
          docker push ${IMAGE}:latest

      - name: Deploy
        if: ${{ github.ref_name == 'master' }}
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
        run: |-
          mkdir -p ~/.ssh
          openssl aes-256-cbc \
            -K "${{ secrets.encrypted_699ce602e140_key }}" \
            -iv "${{ secrets.encrypted_699ce602e140_iv }}" \
            -in deploy_key.enc \
            -out ~/.ssh/deploy_key -d
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key of the deploy server (ssh-keyscan + compared with a trusted known_hosts)
          echo "${DEPLOY_SERVER} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILxPKtD7R9g5eKM3M7CU9pu3pjmgjOwTRZK56OHAlJ16" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_SERVER}" 'bash -s' < deploy.sh
