version: 2
updates:
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  ignore:
  - dependency-name: Pomelo.EntityFrameworkCore.MySql
    versions:
    - 3.2.4
    - 3.2.5
  - dependency-name: Quartz.Serialization.Json
    versions:
    - 3.2.4
    - 3.3.1
  - dependency-name: Quartz
    versions:
    - 3.2.4
    - 3.3.1
  - dependency-name: Microsoft.AspNetCore.Mvc.Testing
    versions:
    - 5.0.2
    - 5.0.3
    - 5.0.4
  - dependency-name: Serilog.AspNetCore
    versions:
    - 3.4.0
    - 4.0.0
  - dependency-name: Microsoft.NET.Test.Sdk
    versions:
    - 16.8.3
    - 16.9.1
  - dependency-name: Microsoft.VisualStudio.Web.CodeGeneration.Design
    versions:
    - 5.0.1
  # Pomelo.EntityFrameworkCore.MySql 9.x pins EF Core to 9.x; bump together with Pomelo
  - dependency-name: Microsoft.EntityFrameworkCore.*
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
